<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d4aff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Collezioni">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Archivio Collezioni</title>
<style>
:root{
  --bg:#f4f3f8; --card:#ffffff; --ink:#1c1b29; --mute:#6c6a80; --line:#e3e1ee;
  --accent:#6d4aff; --accent-ink:#ffffff; --warn:#b45309; --warn-bg:#fff4d6; --danger:#c2253b;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12121c; --card:#1d1d2c; --ink:#f0eff8; --mute:#9b99b3; --line:#2c2c42;
    --accent:#8b6dff; --accent-ink:#ffffff; --warn:#fbbf24; --warn-bg:#3a2e0e; --danger:#ff6b81; color-scheme:dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));padding-top:calc(14px + env(safe-area-inset-top))}
h1{margin:0;font-size:22px;letter-spacing:-.3px}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
main{padding:0 max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left));max-width:720px;margin:0 auto}
input,select,textarea,button{font:inherit;color:inherit}
.field{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--card);border-radius:12px;outline:none}
.field:focus{border-color:var(--accent)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.types{padding-top:6px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:99px;font-size:14px;cursor:pointer}
.chips.types .chip{padding:5px 11px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stats{display:flex;gap:10px;margin:10px 0}
.stat{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left;width:100%}
.thumb{flex:0 0 56px;width:56px;height:56px;border-radius:10px;background:var(--line);display:grid;place-items:center;font-size:26px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.meta{flex:1;min-width:0}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line2{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.qty{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:12px;padding:1px 8px;margin-top:3px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:13px 16px;border-radius:12px;font-weight:600;cursor:pointer;width:100%;text-decoration:none;display:inline-block;text-align:center}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--card);color:var(--danger);border:1px solid var(--line)}
.btn.small{width:auto;padding:8px 12px;font-size:14px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));z-index:6}
nav button{flex:1;border:0;background:none;padding:6px 0;font-size:11px;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:22px}
nav button.on{color:var(--accent)}
nav button.plus i{background:var(--accent);color:var(--accent-ink);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:28px;margin-top:-18px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:none}
.sheet-bg.open{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-width:720px;margin:0 auto}
.sheet h2{margin:0 0 4px;font-size:19px}
.dup{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}
.dup b{display:block;margin-bottom:4px}
.dup .m{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.web{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.web a{border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;padding:7px 12px;border-radius:99px;font-size:14px}
.web a::after{content:" ↗";color:var(--mute)}
.photo{display:flex;gap:12px;align-items:center;margin-top:6px}
.photo .thumb{flex:0 0 76px;width:76px;height:76px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.card h3{margin:0 0 8px;font-size:15px}
.bar{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.bar:last-child{border:0}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--mute);margin:6px 0 10px}
.inline{display:flex;gap:8px;margin-top:8px}
.inline .field{flex:1}
.sect{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.link{border:0;background:none;color:var(--accent);font-size:14px;cursor:pointer;padding:4px 2px;text-transform:none;letter-spacing:0;font-weight:600}
.folders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.folder{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left;min-width:0}
.folder i{font-style:normal;font-size:24px;line-height:1.2}
.folder b{font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.folder span{font-size:12px;color:var(--mute)}
.folder.add,.chip.add{border-style:dashed;color:var(--accent);background:transparent}
.crumb{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-size:15px;min-width:0}
.crumb button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.crumb b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mrow>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.mrow>span:last-child{display:flex;gap:6px;flex:0 0 auto}
.findbtn{margin-top:10px}
.finder{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.finder .head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.finder .head b{font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.res{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.res img,.res .noimg{width:100%;aspect-ratio:63/88;object-fit:contain;border-radius:6px;background:var(--line)}
.res .noimg{display:grid;place-items:center;font-size:12px;color:var(--mute)}
.res .t{font-size:12px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .s{font-size:11px;color:var(--mute);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .p{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.vars{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.vars button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer}
.src{font-size:11px;color:var(--mute);margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header>
  <h1 id="title">Archivio Collezioni</h1>
  <div class="sub" id="subtitle"></div>
</header>
<main id="main"></main>

<nav>
  <button data-v="coll" class="on"><i>📚</i>Collezione</button>
  <button data-v="wish"><i>⭐</i>Mi manca</button>
  <button class="plus" id="addBtn"><i>＋</i>Aggiungi</button>
  <button data-v="more"><i>⚙️</i>Altro</button>
</nav>

<div class="sheet-bg" id="bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Archivio (IndexedDB, regge migliaia di oggetti, funziona offline) ---------- */
const DB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    if (db) return res(db);
    const r = indexedDB.open('archivio-collezioni', 2);
    r.onupgradeneeded = () => { const d = r.result;
      if (!d.objectStoreNames.contains('items')) d.createObjectStore('items', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta'); };
    r.onsuccess = () => { db = r.result; res(db); };
    r.onerror = () => rej(r.error);
  });
  const tx = (mode, fn) => open().then(d => new Promise((res, rej) => {
    const t = d.transaction('items', mode); const s = t.objectStore('items');
    const out = fn(s); t.oncomplete = () => res(out.result !== undefined ? out.result : undefined); t.onerror = () => rej(t.error);
  }));
  return {
    all: () => tx('readonly', s => s.getAll()),
    put: it => tx('readwrite', s => s.put(it)),
    del: id => tx('readwrite', s => s.delete(id)),
    clear: () => tx('readwrite', s => s.clear()),
    putMany: arr => open().then(d => new Promise((res, rej) => {
      const t = d.transaction('items', 'readwrite'); const s = t.objectStore('items');
      arr.forEach(x => s.put(x)); t.oncomplete = res; t.onerror = () => rej(t.error);
    })),
    getMeta: k => open().then(d => new Promise((res, rej) => {
      const q = d.transaction('meta').objectStore('meta').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    })),
    setMeta: (k, v) => open().then(d => new Promise((res, rej) => {
      const t = d.transaction('meta', 'readwrite'); t.objectStore('meta').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error);
    }))
  };
})();

/* ---------- Brand e tipi ---------- */
const BASE_BRANDS = ['Pokémon','Il Signore degli Anelli','Harry Potter','Minecraft','Stranger Things','Altro'];
const ICONS = {'Pokémon':'⚡','Il Signore degli Anelli':'💍','Harry Potter':'🪄','Minecraft':'⛏️','Stranger Things':'🔦','Altro':'📦'};
const TYPES = ['Carte','Box / booster','Fumetto / graphic novel','Libro','Funko','Action figure / statua','Peluche','Videogioco','Gadget','Vintage','Altro'];
const CONDS = ['Nuovo / sigillato','Come nuovo','Ottimo','Buono','Usato','Rovinato'];
const CARD_TYPES = ['Carte','Box / booster'];
const LANGS = ['Italiano','Inglese','Giapponese','Francese','Tedesco','Spagnolo','Portoghese','Cinese','Coreano','Altra'];
const LANG_CODE = {Italiano:'ITA',Inglese:'ENG',Giapponese:'JAP',Francese:'FRA',Tedesco:'GER',Spagnolo:'SPA',Portoghese:'POR',Cinese:'CHN',Coreano:'KOR'};
const TYPE_ICONS = {'Carte':'🃏','Box / booster':'📦','Fumetto / graphic novel':'📖','Libro':'📚','Funko':'🧸','Action figure / statua':'🦸','Peluche':'🐻','Videogioco':'🎮','Gadget':'🎁','Vintage':'📻','Altro':'🗂️'};
/* Cartelle di partenza per i brand di Giangy: si possono rinominare o eliminare da "Gestisci" */
const DEFAULT_SUBS = {'Pokémon':['Carte','Box / booster','Videogioco','Peluche','Funko'],'Il Signore degli Anelli':['Libro','Funko','Action figure / statua','Gadget'],
  'Harry Potter':['Libro','Funko','Action figure / statua','Gadget'],'Minecraft':['Videogioco','Peluche','Gadget','Libro'],'Stranger Things':['Funko','Gadget','Libro'],'Altro':[]};

/* Le schede della prima versione avevano una "collezione" per tipo: la trasformo in brand + tipo */
const OLD_COLL = {'Pokémon':['Pokémon',''],'Carte collezionabili':['Altro','Carte'],'Graphic novel':['Altro','Fumetto / graphic novel'],
  'Funko':['Altro','Funko'],'Nerd':['Altro','Gadget'],'Vintage':['Altro','Vintage']};
function migrate(i){
  if (i.brand === undefined) {
    const m = OLD_COLL[i.coll] || [i.coll || 'Altro', ''];
    i.brand = m[0]; i.type = i.type || m[1]; delete i.coll; i._mig = true;
  }
  return i;
}

let items = [], view = 'coll', fBrand = 'Tutti', fType = 'Tutti', query = '';
/* Brand e sottocartelle create da Giangy (anche vuote), salvate nell'archivio del telefono */
let struct = {brands: [...BASE_BRANDS], subs: JSON.parse(JSON.stringify(DEFAULT_SUBS))};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (Number(n)||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const icon = b => ICONS[b] || '📦';
const tIcon = t => TYPE_ICONS[t] || '📁';
const brands = () => [...new Set([...struct.brands, ...items.map(i => i.brand)].filter(b => b && b !== 'Altro')), 'Altro'];
const subsOf = b => [...new Set([...(struct.subs[b] || []), ...items.filter(i => i.brand === b && i.type).map(i => i.type)])];
const typesFor = b => [...new Set([...subsOf(b), ...TYPES, ...items.map(i => i.type).filter(Boolean)])];
async function saveStruct(){ try { await DB.setMeta('struct', struct); } catch {} }
function addBrand(b){ if (!struct.brands.includes(b)) { const k = struct.brands.indexOf('Altro'); struct.brands.splice(k < 0 ? struct.brands.length : k, 0, b); } struct.subs[b] = struct.subs[b] || []; }
function addSub(b, t){ if (!b || !t) return; addBrand(b); if (!struct.subs[b].includes(t)) struct.subs[b].push(t); }
const pcs = l => l.reduce((a,i)=>a+(+i.qty||1),0);
const sum = (l,k) => l.reduce((a,i)=>a+(+i[k]||0)*(+i.qty||1),0);
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('show'),2400); }

/* ---------- Doppioni ---------- */
function findDups(name, brand, selfId, serial){
  const n = norm(name), sn = norm(serial);
  if (n.length < 3 && !sn) return [];
  return items.filter(i => i.id !== selfId && (() => {
    if (sn && norm(i.serial) === sn && (!brand || i.brand === brand)) return true;
    if (n.length < 3) return false;
    const m = norm(i.name);
    if (!m) return false;
    if (m === n) return true;
    return i.brand === brand && n.length >= 5 && (m.includes(n) || n.includes(m));
  })());
}

/* ---------- Ricerca sul web: apre il sito con l'oggetto già cercato ---------- */
function webLinks(name, brand, type, edition){
  const q = [name, edition, brand && brand !== 'Altro' && !norm(name).includes(norm(brand)) ? brand : ''].filter(Boolean).join(' ').trim();
  if (norm(q).length < 3) return '';
  const e = encodeURIComponent(q);
  const l = [];
  if (brand === 'Pokémon' && (CARD_TYPES.includes(type) || !type)) l.push(['Cardmarket', `https://www.cardmarket.com/it/Pokemon/Products/Search?searchString=${encodeURIComponent([name, edition].filter(Boolean).join(' '))}`]);
  else if (CARD_TYPES.includes(type)) l.push(['Cardmarket', `https://www.cardmarket.com/it/Search?searchString=${encodeURIComponent(name)}`]);
  l.push(['eBay', `https://www.ebay.it/sch/i.html?_nkw=${e}`],
         ['Vinted', `https://www.vinted.it/catalog?search_text=${e}`],
         ['Subito', `https://www.subito.it/annunci-italia/vendita/usato/?q=${e}`],
         ['Amazon', `https://www.amazon.it/s?k=${e}`],
         ['Google Immagini', `https://www.google.com/search?tbm=isch&q=${e}`]);
  return l.map(([t,u]) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`).join('');
}

/* ---------- Viste ---------- */
function render(){
  document.querySelectorAll('nav button[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  const owned = items.filter(i => !i.wish), wish = items.filter(i => i.wish);
  $('#subtitle').textContent = `${pcs(owned)} pezzi · ${owned.length} schede · ${wish.length} in lista desideri`;
  if (view === 'more') return renderMore();
  const isWish = view === 'wish';
  $('#title').textContent = isWish ? 'Mi manca' : 'Archivio Collezioni';
  const base = isWish ? wish : owned;
  const match = i => !query || norm([i.name,i.notes,i.brand,i.type,i.edition,i.serial,i.where,i.lang].join(' ')).includes(norm(query));
  const inBrand = base.filter(i => fBrand === 'Tutti' || i.brand === fBrand);
  const inType = i => fType === 'Tutti' || (fType === '' ? !i.type : i.type === fType);
  const list = inBrand.filter(i => inType(i) && match(i)).sort((a,b)=>b.added-a.added);
  const shownB = brands().filter(b => base.some(i => i.brand === b) || (!isWish && b !== 'Altro'));
  const worth = sum(list,'value');
  let nav = '', head = '';
  if (fType === 'Tutti') {
    nav = `<div class="chips">${['Tutti', ...shownB].map(b => `<button class="chip ${b===fBrand?'on':''}" data-b="${esc(b)}">${b==='Tutti'?'Tutti i brand':icon(b)+' '+esc(b)}</button>`).join('')}${!isWish ? '<button class="chip add" id="addBrand" type="button">＋ Brand</button>' : ''}</div>`;
  }
  if (fBrand !== 'Tutti' && fType === 'Tutti') {
    const tiles = subsOf(fBrand).map(t => ({t, n: pcs(inBrand.filter(i => i.type === t))}));
    const loose = inBrand.filter(i => !i.type);
    if (loose.length) tiles.push({t:'', n: pcs(loose)});
    const vis = isWish ? tiles.filter(x => x.n) : tiles;
    nav += `<div class="sect"><span>Cartelle di ${esc(fBrand)}</span>${!isWish ? '<button class="link" id="manage" type="button">Gestisci</button>' : ''}</div>
      <div class="folders">${vis.map(x => `<button class="folder" type="button" data-t="${esc(x.t)}"><i>${x.t ? tIcon(x.t) : '📂'}</i><b>${x.t ? esc(x.t) : 'Senza cartella'}</b><span>${x.n} ${x.n === 1 ? 'pezzo' : 'pezzi'}</span></button>`).join('')}
      ${!isWish ? '<button class="folder add" id="addSub" type="button"><i>＋</i><b>Aggiungi</b><span>cartella</span></button>' : ''}</div>`;
    head = `<div class="sect"><span>Tutti gli oggetti di ${esc(fBrand)}</span></div>`;
  }
  if (fBrand !== 'Tutti' && fType !== 'Tutti') {
    nav = `<div class="crumb"><button id="back" type="button">‹ ${icon(fBrand)} ${esc(fBrand)}</button><b>${fType ? tIcon(fType)+' '+esc(fType) : '📂 Senza cartella'}</b></div>`;
  }
  const empty = base.length ? (fType !== 'Tutti' && !query ? 'Questa cartella è vuota.<br>Premi ＋ per aggiungere un oggetto qui.' : 'Nessun risultato.')

    fBrand = ex || n; fType = 'Tutti'; render();
  });
  if ($('#addSub')) $('#addSub').onclick = () => askName(`Nuova cartella in ${fBrand}`, 'Es. Poster, Tazze, Monete', async t => {

    render();

const ARCH_CHOICES = [['pokemon','⚡ Carte Pokémon'],['magic','🃏 Carte Magic (anche Signore degli Anelli)'],['book','📚 Libri e fumetti'],['funko','🧸 Funko']];
function archiveFromSearch(wish){
  const text = query.trim(), b = fBrand === 'Tutti' ? '' : fBrand, t = fType === 'Tutti' ? '' : fType;
  const go = pv => openForm(null, wish, {name: text, find: true,
    brand: pv === 'pokemon' ? 'Pokémon' : (b && !(pv === 'magic' && b === 'Pokémon') ? b : 'Altro'),
    type: pv === 'book' ? (t === 'Fumetto / graphic novel' ? t : 'Libro') : pv === 'funko' ? 'Funko' : 'Carte'});

/* Gestisci un brand: rinomina brand e cartelle, elimina solo ciò che è vuoto */
function openManage(b){
  const inB = items.filter(i => i.brand === b), subs = subsOf(b);
  $('#sheet').innerHTML = `<h2>Gestisci ${icon(b)} ${esc(b)}</h2>
    <div class="hint">Brand e cartelle si eliminano solo quando sono vuoti, così non perdi nessun oggetto.</div>
    <div class="mrow"><span><b>${esc(b)}</b> · ${inB.length} schede</span><span>${b !== 'Altro' ? '<button class="btn sec small" data-ren="1" type="button">Rinomina</button>' : ''}${!inB.length && b !== 'Altro' ? '<button class="btn danger small" data-delb="1" type="button">Elimina</button>' : ''}</span></div>
    <label>Cartelle</label>
    ${subs.map((t,k) => { const n = inB.filter(i => i.type === t).length;
      return `<div class="mrow"><span>${tIcon(t)} ${esc(t)} · ${n} schede</span><span><button class="btn sec small" data-rens="${k}" type="button">Rinomina</button>${!n ? `<button class="btn danger small" data-dels="${k}" type="button">Elimina</button>` : ''}</span></div>`; }).join('') || '<div class="hint">Nessuna cartella.</div>'}
    <div style="height:16px"></div><button class="btn sec" id="m_close" type="button">Chiudi</button>`;
  $('#bg').classList.add('open');
  $('#m_close').onclick = closeForm;
  const ren = $('[data-ren]');
  if (ren) ren.onclick = () => askName(`Rinomina ${b}`, '', async n => {
    if (n === b) return openManage(b);
    if (brands().some(x => norm(x) === norm(n))) { toast('Esiste già un brand con questo nome'); return openManage(b); }
    const k = struct.brands.indexOf(b); if (k >= 0) struct.brands[k] = n; else addBrand(n);
    struct.subs[n] = [...new Set([...(struct.subs[n] || []), ...(struct.subs[b] || [])])]; delete struct.subs[b];
    const ch = items.filter(i => i.brand === b); ch.forEach(i => i.brand = n);
    await DB.putMany(ch); await saveStruct(); fBrand = n; await reload(); toast('Brand rinominato'); openManage(n);
  }, b);
  const delb = $('[data-delb]');
  if (delb) delb.onclick = async () => {
    if (delb.dataset.sure !== '1') { delb.dataset.sure = '1'; delb.textContent = 'Sicuro?'; return; }
    struct.brands = struct.brands.filter(x => x !== b); delete struct.subs[b];
    await saveStruct(); fBrand = 'Tutti'; fType = 'Tutti'; closeForm(); render(); toast('Brand eliminato');
  };
  document.querySelectorAll('[data-rens]').forEach(btn => btn.onclick = () => { const t = subs[+btn.dataset.rens];
    askName(`Rinomina cartella ${t}`, '', async n => {
      if (n !== t) {
        if (subs.some(x => norm(x) === norm(n) && x !== t)) { toast('Esiste già una cartella con questo nome'); return openManage(b); }
        addSub(b, t); struct.subs[b] = struct.subs[b].map(x => x === t ? n : x);
        const ch = items.filter(i => i.brand === b && i.type === t); ch.forEach(i => i.type = n);
        await DB.putMany(ch); await saveStruct(); await reload(); toast('Cartella rinominata');
      }
      openManage(b);
    }, t); });
  document.querySelectorAll('[data-dels]').forEach(btn => btn.onclick = async () => {
    if (btn.dataset.sure !== '1') { btn.dataset.sure = '1'; btn.textContent = 'Sicuro?'; return; }
    const t = subs[+btn.dataset.dels]; struct.subs[b] = (struct.subs[b] || []).filter(x => x !== t);
    await saveStruct(); render(); toast('Cartella eliminata'); openManage(b);
  });
}

/* ---------- Ricerca negli archivi pubblici: Pokémon (TCGdex), Magic (Scryfall), libri (Open Library), Funko (elenco aperto) ---------- */
const jsonCache = new Map();
function getJson(url){
  if (!jsonCache.has(url)) {
    const p = fetch(url).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    jsonCache.set(url, p); p.catch(() => jsonCache.delete(url));
  }
  return jsonCache.get(url);
}

/* Quale archivio usare per brand e cartella della scheda */
function providerFor(brand, type){
  if (brand === 'Pokémon' && (!type || CARD_TYPES.includes(type))) return 'pokemon';
  if (type === 'Funko') return 'funko';
  if (type === 'Libro' || type === 'Fumetto / graphic novel') return 'book';
  if (type === 'Carte') return 'magic';
  return null;
}
const PROVIDERS = {
  pokemon: {btn:'🔎 Cerca la carta: foto, set, numero e prezzo', hint:'“Charizard”, “Pikachu base”, “Mew 4/102”', src:'Dati e immagini: TCGdex · prezzi medi Cardmarket', search: searchPokemon},
  magic: {btn:'🔎 Cerca la carta Magic: foto, set, numero e prezzo', hint:'il nome inglese della carta, es. “Gandalf, Friend of the Shire”', src:'Dati e immagini: Scryfall · prezzi Cardmarket', search: searchMagic},
  book: {btn:'🔎 Cerca il libro: copertina, autore, editore e ISBN', hint:'il titolo, oppure il codice ISBN sul retro', src:'Dati e copertine: Open Library', search: searchBooks},
  funko: {btn:'🔎 Cerca il Funko: foto, numero e serie', hint:'il personaggio, es. “Gandalf”, “Demogorgon 428”', src:'Elenco aperto dei Funko, aggiornato a febbraio 2026 · foto hobbyDB', search: searchFunko},
};

/* Pokémon: "charizard base 4/102" prova il nome più lungo che dà risultati, il resto filtra per set e numero */
const TCG = 'https://api.tcgdex.net/v2/';
async function tcgSearch(text){
  const words = text.trim().split(/\s+/).filter(Boolean);
  let fails = 0;
  for (let n = words.length; n >= 1; n--) {
    const name = encodeURIComponent(words.slice(0, n).join(' '));
    const get = url => getJson(url).catch(() => getJson(url)).catch(() => null);   /* un secondo tentativo se l'archivio inciampa */
    const [it, en] = await Promise.all([get(`${TCG}it/cards?name=${name}`), get(`${TCG}en/cards?name=${name}`)]);
    if (!it && !en) { fails++; continue; }
    if (!it?.length && !en?.length) continue;
    const enImg = new Map((en || []).map(c => [c.id, c.image]));
    const all = new Map();
    (it || []).forEach(c => all.set(c.id, {id:c.id, lang:'it', localId:c.localId, img:c.image || enImg.get(c.id)}));
    (en || []).forEach(c => { if (!all.has(c.id)) all.set(c.id, {id:c.id, lang:'en', localId:c.localId, img:c.image}); });
    let list = [...all.values()];
    const rest = norm(words.slice(n).join(' '));
    /* "58/102" o "58": leggo i dettagli solo delle carte con quel numero */
    const num = (rest.match(/\d+/) || [])[0];
    if (num) { const byNum = list.filter(x => String(x.localId).replace(/^0+/, '') === num.replace(/^0+/, '')); if (byNum.length) list = byNum; }
    return {list: list.slice(0, 150), name: norm(words.slice(0, n).join(' ')), rest};
  }
  if (fails) throw new Error('offline');
  return {list:[], name:'', rest:''};
}
async function tcgDetails(list, progress){
  const out = []; let i = 0, done = 0;
  const work = async () => { while (i < list.length) { const x = list[i++];
    try { out.push({...x, d: await getJson(`${TCG}${x.lang}/cards/${x.id}`)}); } catch {}
    progress(`Leggo ${++done} di ${list.length} carte…`); } };
  await Promise.all(Array.from({length: 8}, work));
  return out;
}
const cmPrice = cm => cm ? (cm.avg30 || cm.avg || cm.trend || 0) : 0;
function variantsOf(d){
  const v = (d.variants_detailed || []).map(x => ({label: [x.type, x.subtype, ...(x.stamp||[])].filter(Boolean).join(' · '), price: cmPrice(x.pricing?.cardmarket), at: x.pricing?.cardmarket?.updated}));
  if (!v.length) v.push({label:'', price: cmPrice(d.pricing?.cardmarket), at: d.pricing?.cardmarket?.updated});
  return v;
}
const cardNum = d => d.localId + (d.set?.cardCount?.official ? '/' + d.set.cardCount.official : '');
async function searchPokemon(text, progress){
  const {list, name, rest} = await tcgSearch(text);
  if (!list.length) return [];
  const det = await tcgDetails(list, progress);
  const words = rest.split(' ').filter(Boolean);
  return det.filter(x => { const h = norm([x.d.set?.name, x.d.set?.id, cardNum(x.d), x.d.rarity].join(' ')); return words.every(w => h.includes(w)); })
    .map(x => ({img: x.img && x.img + '/low.webp', full: x.img && x.img + '/high.webp', title: x.d.name, line1: x.d.set?.name || '',
      line2: cardNum(x.d) + (x.d.rarity ? ' · ' + x.d.rarity : ''), variants: variantsOf(x.d), exact: norm(x.d.name) === name,
      fill: {name: x.d.name, brand: 'Pokémon', type: 'Carte', edition: x.d.set?.name || '', serial: cardNum(x.d)}, ref: {src:'tcgdex', id: x.d.id}}))
    .sort((a,b) => (b.exact - a.exact) || (!!b.img - !!a.img));
}

/* Magic (anche le carte del Signore degli Anelli): tutte le stampe di una carta, con prezzi Cardmarket */
const SF_LANG = {en:'Inglese', it:'Italiano', ja:'Giapponese', fr:'Francese', de:'Tedesco', es:'Spagnolo', pt:'Portoghese', zhs:'Cinese', zht:'Cinese', ko:'Coreano'};
async function searchMagic(text){
  let r;
  try { r = await getJson(`https://api.scryfall.com/cards/search?q=${encodeURIComponent(text.trim())}&unique=prints&order=released`); }
  catch (e) { if (e.message === '404') return []; throw e; }
  const n = norm(text);
  return (r.data || []).slice(0, 120).map(c => {
    const iu = c.image_uris || c.card_faces?.[0]?.image_uris || {};
    const fin = c.finishes || [];
    const v = [];
    if (fin.includes('nonfoil') || !fin.length) v.push({label:'Normale', price: +c.prices?.eur || 0});
    if (fin.includes('foil')) v.push({label:'Foil', price: +c.prices?.eur_foil || 0});
    if (!v.length) v.push({label:'', price: 0});
    return {img: iu.small, full: iu.normal, title: c.name, line1: c.set_name, line2: `${c.collector_number} · ${c.rarity}`, variants: v, exact: norm(c.name) === n,
      fill: {name: c.name, type: 'Carte', edition: c.set_name, serial: String(c.collector_number), lang: SF_LANG[c.lang]}, ref: {src:'scryfall', id: c.id}};
  }).sort((a,b) => b.exact - a.exact);
}

/* Libri: preferisce le edizioni italiane; accetta anche il codice ISBN */
const LANG_OL = {ita:'Italiano', eng:'Inglese', jpn:'Giapponese', fre:'Francese', ger:'Tedesco', spa:'Spagnolo', por:'Portoghese', chi:'Cinese', kor:'Coreano'};
async function searchBooks(text){
  const t = text.trim(), isbn = t.replace(/[-\s]/g, '');
  const q = /^\d{9}[\dXx]$|^\d{13}$/.test(isbn) ? `isbn:${isbn}` : t;
  const f = 'key,title,author_name,first_publish_year,cover_i,editions,editions.key,editions.title,editions.isbn,editions.language,editions.publisher,editions.publish_date,editions.cover_i';
  const r = await getJson(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&lang=it&limit=40&fields=${f}`);
  return (r.docs || []).map(d => {
    const e = d.editions?.docs?.[0] || {}, cover = e.cover_i || d.cover_i;
    const isb = ((e.isbn || []).find(x => x.replace(/-/g, '').length === 13) || (e.isbn || [])[0] || '').replace(/-/g, '');
    const year = (String(e.publish_date?.[0] || '').match(/\d{4}/) || [d.first_publish_year || ''])[0];
    const author = (d.author_name || []).slice(0, 2).join(', '), pub = e.publisher?.[0] || '';
    return {img: cover && `https://covers.openlibrary.org/b/id/${cover}-M.jpg`, full: cover && `https://covers.openlibrary.org/b/id/${cover}-L.jpg`,
      title: e.title || d.title, line1: author, line2: [pub, year].filter(Boolean).join(' · '), variants: [{label:'', price:0}], exact: false,
      fill: {name: e.title || d.title, type: 'Libro', edition: [author, pub, year].filter(Boolean).join(' · '), serial: isb ? 'ISBN ' + isb : '', lang: LANG_OL[(e.language || [])[0]]},
      ref: {src:'openlibrary', id: e.key || d.key}};
  }).sort((a,b) => !!b.img - !!a.img);
}

/* Funko: elenco aperto salvato nel sito (funko.json), scaricato solo la prima volta */
let funkoData = null;
async function searchFunko(text, progress){
  if (!funkoData) { progress('Scarico l’elenco dei Funko (solo la prima volta, circa 1 MB)…'); funkoData = await getJson('funko.json'); }
  const words = norm(text).split(' ').filter(Boolean), n = norm(text), out = [];
  for (const [t, img, series] of funkoData.d) {
    const h = norm(t + ' ' + series);
    if (words.every(w => h.includes(w))) { out.push({t, img, series}); if (out.length >= 150) break; }
  }
  return out.map(x => {
    const num = (x.t.match(/#\s?(\d+[a-z]?)/i) || [])[1];
    const url = !x.img ? '' : x.img[0] === '!' ? x.img.slice(1) : funkoData.p + x.img;
    return {img: url, full: url, title: x.t, line1: x.series || 'Funko Pop', line2: num ? '#' + num : '', variants: [{label:'', price:0}], exact: norm(x.t) === n,
      fill: {name: x.t, type: 'Funko', edition: x.series, serial: num ? '#' + num : ''}, ref: {src:'funko-pop-data', id: x.t}};
  }).sort((a,b) => b.exact - a.exact);
}

/* ---------- Finestra dei risultati, uguale per tutti gli archivi ---------- */
let finderRes = [], finderProv = null;
function finderMsg(title, text){
  $('#finder').innerHTML = `<div class="finder"><div class="head"><b>${title}</b><button class="btn sec small" id="fx" type="button">Chiudi</button></div><div class="hint">${text}</div></div>`;
  $('#fx').onclick = () => $('#finder').innerHTML = '';
}
async function runFinder(){
  const prov = PROVIDERS[providerFor($('#f_brand').value, $('#f_type').value)];
  if (!prov) return;
  const text = $('#f_name').value.trim();
  if (norm(text).length < 2) { finderMsg('Scrivi prima il nome', `Nel campo Nome scrivi ${prov.hint}, poi tocca di nuovo il tasto.`); $('#f_name').focus(); return; }
  $('#finder').innerHTML = `<div class="finder"><div class="head"><b>Cerco “${esc(text)}”…</b></div><div class="hint" id="fprog"></div></div>`;
  try {
    finderProv = prov;
    finderRes = await prov.search(text, msg => { const p = $('#fprog'); if (p) p.textContent = msg; });
    if (!finderRes.length) return finderMsg('Nessun risultato', `Prova a scrivere meno parole, per esempio ${prov.hint}.`);
    renderFinder();
  } catch {
    finderMsg('Archivio non raggiungibile', 'Serve una connessione a internet. Puoi salvare la scheda adesso e cercare più tardi.');
  }
}
function renderFinder(){
  const box = $('#finder'), many = finderRes.length > 12;
  box.innerHTML = `<div class="finder">
    <div class="head"><b>${finderRes.length}${finderRes.length >= 120 ? '+' : ''} risultati</b><button class="btn sec small" id="fx" type="button">Chiudi</button></div>
    <div class="hint">Tocca quello giusto: compilo foto e dati. ${many ? `Per restringere scrivi più dettagli (${finderProv.hint}).` : ''}</div>
    <div class="grid">${finderRes.slice(0, 60).map((r,i) => { const p = Math.max(...r.variants.map(y => y.price || 0));
      return `<button class="res" type="button" data-r="${i}">${r.img ? `<img src="${esc(r.img)}" alt="" loading="lazy">` : '<div class="noimg">senza foto</div>'}
      <span class="t">${esc(r.title)}</span><span class="s">${esc(r.line1)}</span><span class="s">${esc(r.line2) || '&nbsp;'}</span>
      <span class="p">${p ? '≈ '+money(p) : '&nbsp;'}</span></button>`; }).join('')}</div>
    ${finderRes.length > 60 ? `<div class="hint">Mostro i primi 60.</div>` : ''}
    <div class="src">${finderProv.src}</div></div>`;
  $('#fx').onclick = () => box.innerHTML = '';
  document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => pickResult(finderRes[+b.dataset.r]));
  box.scrollIntoView({block:'start', behavior:'smooth'});
}
function pickResult(r){
  const v = r.variants;
  if (v.length < 2) return applyResult(r, v[0]);
  $('#finder').innerHTML = `<div class="finder"><div class="head"><b>Quale versione hai?</b><button class="btn sec small" id="fb" type="button">Indietro</button></div>
    <div class="hint">${esc(r.title)} · ${esc(r.line1)} · ${esc(r.line2)}</div>
    <div class="vars">${v.map((y,i) => `<button type="button" data-v2="${i}"><span>${esc(y.label || 'Normale')}</span><b>${y.price ? '≈ '+money(y.price) : '—'}</b></button>`).join('')}</div></div>`;
  $('#fb').onclick = renderFinder;
  document.querySelectorAll('[data-v2]').forEach(b => b.onclick = () => applyResult(r, v[+b.dataset.v2]));
}
async function applyResult(r, v){
  const f = r.fill, multi = r.variants.length > 1;
  $('#f_name').value = f.name;
  if (f.brand && $('#f_brand').value !== f.brand) { $('#f_brand').value = f.brand; $('#f_brand').dispatchEvent(new Event('change')); }
  const t = $('#f_type').value;
  if (!t || (f.type === 'Carte' && !CARD_TYPES.includes(t))) $('#f_type').value = f.type;
  $('#f_edition').value = [f.edition, multi && v?.label !== 'Normale' ? v?.label : ''].filter(Boolean).join(' · ');
  $('#f_serial').value = f.serial || '';
  if (f.lang && !$('#f_lang').value) $('#f_lang').value = f.lang;
  if (v?.price) $('#f_value').value = Math.round(v.price * 100) / 100;
  draftRef = {...r.ref, variant: v?.label || '', priceAt: v?.at || null};
  $('#finder').innerHTML = `<div class="finder"><div class="hint">✔ Compilato dall'archivio${v?.price ? ` · valore = prezzo medio Cardmarket${v.at ? ' del ' + new Date(v.at).toLocaleDateString('it-IT') : ''}` : ''}. Controlla e salva.</div></div>`;
  $('#f_name').dispatchEvent(new Event('input'));
  if (r.full) {
    $('#f_thumb').textContent = '⏳';
    try { const blob = await fetch(r.full).then(x => { if (!x.ok) throw 0; return x.blob(); }); draftPhoto = await shrink(blob); }
    catch { draftPhoto = r.full; toast('Foto collegata dal web: si vede quando c’è internet'); }   /* alcuni siti non permettono di salvarla */
    $('#f_thumb').innerHTML = draftPhoto ? `<img src="${draftPhoto}" alt="">` : '📷';
  }
}

/* Riduce le foto (max 640px, JPEG) così il telefono non si riempie con migliaia di oggetti */
function shrink(file){
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 640 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .72));
    };
    img.onerror = () => { URL.revokeObjectURL(url); toast('Foto non leggibile'); res(''); };
    img.src = url;
  });
}

/* ---------- Backup / export ---------- */
function download(name, blob){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
const stamp = () => new Date().toISOString().slice(0,10);
function backup(){
  download(`archivio-collezioni-${stamp()}.json`, new Blob([JSON.stringify({v:3, items, struct})], {type:'application/json'}));
  toast('Backup scaricato: mettilo al sicuro su Drive');
}
async function restore(file){
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); if (!Array.isArray(data.items)) throw 0; }
  catch { return toast('Questo file non è un backup dell’archivio'); }
  const recs = data.items.map(i => { migrate(i); delete i._mig; return i; });
  if (data.struct?.brands) { data.struct.brands.forEach(addBrand); Object.entries(data.struct.subs || {}).forEach(([b, l]) => l.forEach(t => addSub(b, t))); await saveStruct(); }
  await DB.putMany(recs); await reload(); toast(`Ripristinate ${recs.length} schede ✔`);
}
function exportCsv(){
  const h = ['Nome','Brand','Cartella','Edizione','Numero di serie','Lingua','Condizione','Quantità','Prezzo pagato','Valore stimato','Dove preso','Note','Lista desideri'];
  const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const n = v => String(v||0).replace('.',',');
  const rows = items.map(i => [i.name,i.brand,i.type,i.edition,i.serial,i.lang,i.cond,i.qty||1,n(i.price),n(i.value),i.where,i.notes,i.wish?'sì':'no'].map(q).join(';'));
  download(`collezioni-${stamp()}.csv`, new Blob([String.fromCharCode(0xFEFF) + [h.map(q).join(';'), ...rows].join('\r\n')], {type:'text/csv;charset=utf-8'}));
  toast('CSV pronto per Excel');
}

/* ---------- Avvio ---------- */
async function reload(){
  if (!reload.done) { reload.done = true;
    try { const st = await DB.getMeta('struct'); if (st?.brands) struct = st; else await saveStruct(); } catch {} }
  items = (await DB.all()).map(migrate);
  const mig = items.filter(i => i._mig);
  if (mig.length) { mig.forEach(i => delete i._mig); await DB.putMany(mig); }
  if (fBrand !== 'Tutti' && !items.some(i => i.brand === fBrand)) { fBrand = 'Tutti'; fType = 'Tutti'; }
  render();
}
